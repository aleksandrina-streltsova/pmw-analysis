# Full dataset with transform v5, settings as in the spring 2025 quantization (summary 2026, B2).
# Run with --step statistics, then --step quantize, then --step merge.
transform: v5
dir: /ltenas8/data/PMW_Analysis/summary_2026/b2/factor2
surface-type: all
filter-by-quality: false
clip: true
lat-limit: 70
# GPROF variables needed by the signature figures; no quality-flag or sun-glint columns, since there's no filtering
l2-l3-columns: [surfaceTypeIndex, surfacePrecipitation, totalColumnWaterVaporIndex]
# Uncertainty factor 2: about 3.1M signatures (HyperLogLog estimate), i.e. about 7 000x compression
# of the 21 900 988 866 observations (2018-2023, |lat| <= 70)
max-n-final: 5000000
factors: [2]
# Blocks of ~50M rows; peak memory on the slice: statistics 11 GB, quantize 40 GB, merge 28 GB at 1M rows
# per merge call (37 GB at 1.4M); merging value counts is memory-heavy, hence at most 2M rows at once
chunk-size: 50000000
chunk-size-merge: 2000000
